name: Aloud
options:
  bundleIdPrefix: com.tilak
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.17.5
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    exactVersion: 1.10.0

targets:
  Aloud:
    type: application
    platform: macOS
    sources:
      - path: Sources/Aloud
      # The voice model, filled in by the pre-build script below and
      # copied into the app as Resources/Model.
      - path: Model
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Fetch voice model
        script: /usr/bin/python3 "$SRCROOT/scripts/fetch-model.py"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: FluidAudio
        product: FluidAudio
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
    info:
      path: Sources/Aloud/Info.plist
      properties:
        CFBundleName: Aloud
        CFBundleDisplayName: Aloud
        CFBundleShortVersionString: "0.1.7"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tilak.Aloud
        MARKETING_VERSION: "0.1.8"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # The fetch script downloads into Model/, outside what a sandboxed
        # build script may write.
        ENABLE_USER_SCRIPT_SANDBOXING: false
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
